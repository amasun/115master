<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MASTER 播放器交互原型 · 115 master fusion+</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-canvas: #000000;
      --bg-chrome: #0a0a0a;
      --bg-surface: #141416;
      --bg-floating: #1c1c1e;
      --border: #262629;
      --border-strong: #323236;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
      --primary: #2585ff;
      --pink: #ec4899;
      --emerald: #10b981;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }

    .player-shell {
      display: flex;
      width: 100%;
      height: 100%;
      background: var(--bg-canvas);
    }

    .stage-column {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at 50% 44%, #1b1d24 0%, #09090b 65%, #000 100%);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      height: 46px;
      padding: 0 16px;
      background: rgba(10, 10, 10, 0.86);
      border-bottom: 1px solid var(--border);
      z-index: 5;
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .code-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(37, 133, 255, 0.16);
      border: 1px solid rgba(37, 133, 255, 0.35);
      color: #60a5fa;
      font-size: 11px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .video-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .pill-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(16, 185, 129, 0.32);
      color: #34d399;
      font-size: 11px;
      font-weight: 500;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-floating);
      color: var(--text-primary);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn-pill:hover { background: #26262a; }
    .btn-pill.active {
      background: rgba(37, 133, 255, 0.18);
      border-color: rgba(37, 133, 255, 0.55);
      color: #93c5fd;
    }
    .btn-pill.pink-active {
      background: rgba(236, 72, 153, 0.18);
      border-color: rgba(236, 72, 153, 0.55);
      color: #f9a8d4;
    }

    /* Viewport */
    .viewport {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
    }

    .ambient-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
    }

    .center-play-btn {
      width: 68px;
      height: 68px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(20, 20, 22, 0.78);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.18s, background 0.18s, opacity 0.2s;
      z-index: 2;
    }
    .viewport:hover .center-play-btn {
      transform: scale(1.06);
      background: rgba(37, 133, 255, 0.88);
      border-color: transparent;
    }
    .center-play-btn.playing {
      opacity: 0.28;
    }
    .viewport:hover .center-play-btn.playing {
      opacity: 0.95;
    }

    .stage-hint {
      position: absolute;
      top: 14px;
      left: 16px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(20, 20, 22, 0.84);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 11px;
      pointer-events: none;
    }

    .toast-banner {
      position: absolute;
      top: 14px;
      right: 16px;
      padding: 6px 12px;
      border-radius: 10px;
      background: rgba(20, 20, 22, 0.94);
      border: 1px solid var(--border-strong);
      color: var(--text-primary);
      font-size: 11.5px;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      z-index: 8;
    }
    .toast-banner.show {
      opacity: 1;
      transform: translateY(0);
    }

    .subtitle-overlay {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 14px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.72);
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      max-width: 82%;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      z-index: 3;
    }
    .subtitle-overlay.hidden { display: none; }

    /* Marker Drawer */
    .marker-drawer {
      position: absolute;
      right: 16px;
      bottom: 12px;
      width: 280px;
      max-height: 260px;
      display: none;
      flex-direction: column;
      border-radius: 14px;
      background: rgba(20, 20, 22, 0.96);
      border: 1px solid var(--border-strong);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      z-index: 9;
      overflow: hidden;
    }
    .marker-drawer.open { display: flex; }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
    }

    .drawer-list {
      overflow-y: auto;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .marker-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 9px;
      border-radius: 9px;
      background: var(--bg-floating);
      cursor: pointer;
      transition: background 0.12s;
    }
    .marker-item:hover { background: #27272b; }

    .marker-item-main {
      min-width: 0;
      flex: 1;
    }
    .marker-item-time {
      font-size: 10.5px;
      color: #f472b6;
      font-weight: 600;
    }
    .marker-item-label {
      font-size: 11.5px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .marker-item-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-mini-btn {
      border: 0;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      padding: 2px 5px;
      border-radius: 5px;
      cursor: pointer;
    }
    .icon-mini-btn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text-primary); }
    .icon-mini-btn.del:hover { color: #f87171; }

    /* Controls Bar */
    .controls {
      background: rgba(10, 10, 10, 0.94);
      border-top: 1px solid var(--border);
      padding: 10px 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 6;
    }

    .timeline-wrap {
      position: relative;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .timeline-track {
      position: relative;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: #27272a;
      transition: height 0.12s;
    }
    .timeline-wrap:hover .timeline-track { height: 8px; }

    .timeline-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      border-radius: 999px;
      background: var(--primary);
      pointer-events: none;
    }

    .timeline-thumb {
      position: absolute;
      top: 50%;
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #ffffff;
      border: 2.5px solid var(--primary);
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 8px rgba(37, 133, 255, 0.65);
    }

    .marker-tick {
      position: absolute;
      top: 50%;
      width: 5px;
      height: 14px;
      border-radius: 2.5px;
      background: var(--pink);
      border: 1px solid rgba(255, 255, 255, 0.75);
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 3;
      transition: transform 0.12s;
    }
    .marker-tick:hover { transform: translate(-50%, -50%) scale(1.25); }

    .hover-preview {
      position: absolute;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 6px 8px;
      border-radius: 10px;
      background: var(--bg-floating);
      border: 1px solid var(--border-strong);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 10;
    }
    .hover-preview.show { display: flex; }

    .hover-thumb-box {
      width: 108px;
      height: 60px;
      border-radius: 6px;
      background: linear-gradient(135deg, #1f1f24, #2b2932);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-secondary);
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-label {
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    select.ctrl-select {
      height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--border-strong);
      background: var(--bg-floating);
      color: var(--text-primary);
      font-size: 11.5px;
      outline: none;
      cursor: pointer;
    }

    /* Right Sidebar */
    .side-panel {
      width: 268px;
      flex-shrink: 0;
      background: var(--bg-chrome);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 14px;
      gap: 14px;
    }
    .side-panel.collapsed { display: none; }

    .side-section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .meta-card {
      padding: 12px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .ltx-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #4f46e5, #9333ea, #db2777);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
    }

    .rating-pill {
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--bg-floating);
      color: #fcd34d;
      font-size: 10.5px;
    }

    .playlist-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .playlist-item:hover { background: var(--bg-floating); }
    .playlist-item.active {
      background: rgba(37, 133, 255, 0.12);
      border-color: rgba(37, 133, 255, 0.45);
    }
    .playlist-code { font-size: 11px; font-weight: 600; color: var(--text-primary); }
    .playlist-sub { font-size: 10.5px; color: var(--text-secondary); }

    @media (max-width: 760px) {
      .side-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="player-shell">
    <div class="stage-column">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="title-wrap">
          <span class="code-badge mono" id="activeCode">STAR-801</span>
          <span class="video-title" id="activeTitle">星夜霓虹下的东京漫游记（4K HDR 收藏版）</span>
        </div>
        <div class="top-actions">
          <span class="pill-status" title="打点与备注已启用 115 原生文件备注云同步">☁ 115 备注同步</span>
          <button type="button" class="btn-pill active" id="toggleSidebarBtn">详情 / 列表</button>
        </div>
      </header>

      <!-- Main Video Stage -->
      <div class="viewport" id="viewport">
        <div class="ambient-grid"></div>
        <div class="stage-hint">点击画面播放/暂停 · 键盘 Space 播放 · B 打点 · , / . 跳转</div>
        <div class="toast-banner" id="toast"></div>

        <button type="button" class="center-play-btn" id="centerPlayBtn" aria-label="播放或暂停">
          <svg id="centerIconPlay" width="26" height="26" viewBox="0 0 24 24" fill="#fff">
            <polygon points="6,4 20,12 6,20"></polygon>
          </svg>
          <svg id="centerIconPause" width="24" height="24" viewBox="0 0 24 24" fill="#fff" style="display:none">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
        </button>

        <div class="subtitle-overlay" id="subtitleBox">
          [Thunder 字幕] 今夜的东京港湾，灯火比记忆中更加明亮。
        </div>

        <!-- Floating Marker Drawer -->
        <div class="marker-drawer" id="markerDrawer">
          <div class="drawer-head">
            <span>视频打点 (<span id="drawerCount">3</span>)</span>
            <button type="button" class="btn-pill pink-active" id="addMarkerQuickBtn" style="height:22px;padding:0 8px;font-size:10.5px;">+ 当前打点 (B)</button>
          </div>
          <div class="drawer-list" id="drawerList"></div>
        </div>
      </div>

      <!-- Controls Bar -->
      <footer class="controls">
        <div class="timeline-wrap" id="timelineWrap">
          <div class="hover-preview" id="hoverPreview">
            <div class="hover-thumb-box mono" id="hoverThumbLabel">缩略图预览</div>
            <span class="mono" style="font-size:10.5px;color:#f5f5f7;" id="hoverTimeText">00:00:00</span>
          </div>
          <div class="timeline-track" id="timelineTrack">
            <div class="timeline-fill" id="timelineFill" style="width: 31.3%;"></div>
            <div class="timeline-thumb" id="timelineThumb" style="left: 31.3%;"></div>
          </div>
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <button type="button" class="btn-pill" id="playBtn">播放</button>
            <button type="button" class="btn-pill" id="prevMarkerBtn" title="上一个打点 (,)">‹ 上一点</button>
            <button type="button" class="btn-pill" id="nextMarkerBtn" title="下一个打点 (.)">下一点 ›</button>
            <span class="time-label mono"><span id="curTimeLabel">00:42:10</span> / <span id="durTimeLabel">02:14:30</span></span>
          </div>

          <div class="controls-right">
            <button type="button" class="btn-pill pink-active" id="addMarkerBtn">+ 打点 (B)</button>
            <button type="button" class="btn-pill" id="toggleDrawerBtn">打点列表 (<span id="markerCountLabel">3</span>)</button>
            <select class="ctrl-select" id="subtitleSelect" aria-label="字幕">
              <option value="thunder">字幕：中文字幕 · Thunder</option>
              <option value="bilingual">字幕：双语 · SubtitleCat</option>
              <option value="off">字幕：关闭</option>
            </select>
            <select class="ctrl-select" id="qualitySelect" aria-label="画质">
              <option value="ultra">Ultra 原画</option>
              <option value="4k">4K HDR</option>
              <option value="1080p">1080P 高清</option>
              <option value="720p">720P 流畅</option>
            </select>
            <select class="ctrl-select" id="speedSelect" aria-label="倍速">
              <option value="0.75">0.75x</option>
              <option value="1" selected>1.0x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2.0x</option>
            </select>
          </div>
        </div>
      </footer>
    </div>

    <!-- Right Info & Playlist Panel -->
    <aside class="side-panel" id="sidePanel">
      <div>
        <div class="side-section-title">当前影片信息</div>
        <div class="meta-card">
          <div class="badge-row">
            <span class="ltx-badge mono">LTX</span>
            <span class="rating-pill mono">★ 4.8 (1.2k)</span>
          </div>
          <div style="font-size:12.5px;font-weight:600;line-height:1.4;" id="sideTitle">星夜霓虹下的东京漫游记（4K HDR 收藏版）</div>
          <div style="font-size:11px;color:#a1a1aa;">演员：三上悠亚 · 片商：S1</div>
          <div style="font-size:11px;color:#60a5fa;">片名备注：经典必看收藏（已写入 115 备注）</div>
        </div>
      </div>

      <div>
        <div class="side-section-title">同目录播放列表</div>
        <div style="display:flex;flex-direction:column;gap:6px;" id="playlistContainer"></div>
      </div>
    </aside>
  </div>

  <script>
    const playlist = [
      { code: 'STAR-801', title: '星夜霓虹下的东京漫游记（4K HDR 收藏版）', duration: 8070, badge: 'LTX' },
      { code: 'SSIS-642', title: '京都古宅的静谧雨夜（AI 修复高码率版）', duration: 7425, badge: 'LADA' },
      { code: 'IPX-912', title: '海滨长廊与午后日光浴（加长未删减母带）', duration: 6492, badge: '无码' },
    ];

    let activeIndex = 0;
    let duration = playlist[0].duration;
    let currentTime = 2530; // 00:42:10
    let playing = false;
    let speed = 1;
    let timer = null;

    let markers = [
      { id: 1, time: 725, label: '开场片头' },
      { id: 2, time: 2530, label: '高能片段' },
      { id: 3, time: 4540, label: '经典桥段' },
    ];

    const $ = (id) => document.getElementById(id);

    function formatTime(sec) {
      const s = Math.max(0, Math.floor(sec));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      return [h, m, r].map((n) => String(n).padStart(2, '0')).join(':');
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = $('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
    }

    function renderTime() {
      const pct = Math.min(100, Math.max(0, (currentTime / duration) * 100));
      $('timelineFill').style.width = `${pct}%`;
      $('timelineThumb').style.left = `${pct}%`;
      $('curTimeLabel').textContent = formatTime(currentTime);
      $('durTimeLabel').textContent = formatTime(duration);
    }

    function renderMarkers() {
      const track = $('timelineTrack');
      track.querySelectorAll('.marker-tick').forEach((n) => n.remove());

      markers.sort((a, b) => a.time - b.time);
      markers.forEach((m) => {
        const tick = document.createElement('div');
        tick.className = 'marker-tick';
        tick.style.left = `${(m.time / duration) * 100}%`;
        tick.title = `${formatTime(m.time)} · ${m.label}`;
        tick.addEventListener('click', (e) => {
          e.stopPropagation();
          currentTime = m.time;
          renderTime();
          showToast(`已跳转至打点：${formatTime(m.time)} ${m.label}`);
        });
        track.appendChild(tick);
      });

      $('markerCountLabel').textContent = String(markers.length);
      $('drawerCount').textContent = String(markers.length);

      const list = $('drawerList');
      list.innerHTML = '';
      markers.forEach((m) => {
        const row = document.createElement('div');
        row.className = 'marker-item';
        row.innerHTML = `
          <div class="marker-item-main">
            <div class="marker-item-time mono">${formatTime(m.time)}</div>
            <div class="marker-item-label">${m.label}</div>
          </div>
          <div class="marker-item-actions">
            <button type="button" class="icon-mini-btn rename">改名</button>
            <button type="button" class="icon-mini-btn del">删除</button>
          </div>
        `;
        row.addEventListener('click', () => {
          currentTime = m.time;
          renderTime();
          showToast(`跳转：${formatTime(m.time)} ${m.label}`);
        });
        row.querySelector('.rename').addEventListener('click', (e) => {
          e.stopPropagation();
          const next = window.prompt('修改打点备注：', m.label);
          if (next !== null && next.trim()) {
            m.label = next.trim();
            renderMarkers();
            showToast('已更新打点备注并同步至 115');
          }
        });
        row.querySelector('.del').addEventListener('click', (e) => {
          e.stopPropagation();
          markers = markers.filter((item) => item.id !== m.id);
          renderMarkers();
          showToast('已删除打点');
        });
        list.appendChild(row);
      });
    }

    function renderPlaylist() {
      const container = $('playlistContainer');
      container.innerHTML = '';
      playlist.forEach((item, idx) => {
        const btn = document.createElement('div');
        btn.className = `playlist-item ${idx === activeIndex ? 'active' : ''}`;
        btn.innerHTML = `
          <span class="playlist-code mono">${item.code} · ${item.badge}</span>
          <span class="playlist-sub">${item.title}</span>
        `;
        btn.addEventListener('click', () => {
          activeIndex = idx;
          duration = item.duration;
          currentTime = Math.min(currentTime, duration - 10);
          $('activeCode').textContent = item.code;
          $('activeTitle').textContent = item.title;
          $('sideTitle').textContent = item.title;
          renderPlaylist();
          renderTime();
          renderMarkers();
          showToast(`切换播放：${item.code}`);
        });
        container.appendChild(btn);
      });
    }

    function setPlaying(next) {
      playing = next;
      $('playBtn').textContent = playing ? '暂停' : '播放';
      $('centerIconPlay').style.display = playing ? 'none' : 'block';
      $('centerIconPause').style.display = playing ? 'block' : 'none';
      $('centerPlayBtn').classList.toggle('playing', playing);
      clearInterval(timer);
      if (playing) {
        timer = setInterval(() => {
          currentTime = (currentTime + speed) % duration;
          renderTime();
        }, 1000);
      }
    }

    function addMarkerAtCurrent() {
      const nextTime = Math.floor(currentTime);
      const id = Date.now();
      markers.push({ id, time: nextTime, label: `精彩时刻 #${markers.length + 1}` });
      renderMarkers();
      showToast(`已在 ${formatTime(nextTime)} 打点并同步至 115 备注`);
    }

    function jumpMarker(dir) {
      if (markers.length === 0) return;
      const sorted = [...markers].sort((a, b) => a.time - b.time);
      let target = null;
      if (dir > 0) {
        target = sorted.find((m) => m.time > currentTime + 2) || sorted[0];
      } else {
        const prev = sorted.filter((m) => m.time < currentTime - 2);
        target = prev.length ? prev[prev.length - 1] : sorted[sorted.length - 1];
      }
      if (target) {
        currentTime = target.time;
        renderTime();
        showToast(`${dir > 0 ? '下一个' : '上一个'}打点：${formatTime(target.time)} ${target.label}`);
      }
    }

    $('viewport').addEventListener('click', (e) => {
      if (e.target.closest('.marker-drawer')) return;
      setPlaying(!playing);
    });
    $('playBtn').addEventListener('click', () => setPlaying(!playing));
    $('addMarkerBtn').addEventListener('click', addMarkerAtCurrent);
    $('addMarkerQuickBtn').addEventListener('click', addMarkerAtCurrent);
    $('prevMarkerBtn').addEventListener('click', () => jumpMarker(-1));
    $('nextMarkerBtn').addEventListener('click', () => jumpMarker(1));

    $('toggleDrawerBtn').addEventListener('click', () => {
      $('markerDrawer').classList.toggle('open');
    });

    $('toggleSidebarBtn').addEventListener('click', () => {
      const panel = $('sidePanel');
      panel.classList.toggle('collapsed');
      $('toggleSidebarBtn').classList.toggle('active', !panel.classList.contains('collapsed'));
    });

    $('qualitySelect').addEventListener('change', (e) => {
      showToast(`画质已切换为：${e.target.options[e.target.selectedIndex].text}`);
    });

    $('speedSelect').addEventListener('change', (e) => {
      speed = Number(e.target.value) || 1;
      if (playing) setPlaying(true);
      showToast(`播放倍速：${speed}x`);
    });

    $('subtitleSelect').addEventListener('change', (e) => {
      const val = e.target.value;
      const box = $('subtitleBox');
      if (val === 'off') {
        box.classList.add('hidden');
      } else {
        box.classList.remove('hidden');
        box.textContent = val === 'bilingual'
          ? '[SubtitleCat 双语] 今夜的东京港湾，灯火比记忆中更加明亮。 / The harbor lights tonight shine brighter than memory.'
          : '[Thunder 字幕] 今夜的东京港湾，灯火比记忆中更加明亮。';
      }
    });

    const timelineWrap = $('timelineWrap');
    timelineWrap.addEventListener('mousemove', (e) => {
      const rect = timelineWrap.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      const previewTime = ratio * duration;
      const preview = $('hoverPreview');
      preview.classList.add('show');
      preview.style.left = `${Math.min(90, Math.max(10, ratio * 100))}%`;
      $('hoverTimeText').textContent = formatTime(previewTime);
      $('hoverThumbLabel').textContent = `帧预览 ${formatTime(previewTime)}`;
    });
    timelineWrap.addEventListener('mouseleave', () => {
      $('hoverPreview').classList.remove('show');
    });
    timelineWrap.addEventListener('click', (e) => {
      if (e.target.classList.contains('marker-tick')) return;
      const rect = timelineWrap.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
      currentTime = ratio * duration;
      renderTime();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
      else if (e.key === 'b' || e.key === 'B') addMarkerAtCurrent();
      else if (e.key === ',') jumpMarker(-1);
      else if (e.key === '.') jumpMarker(1);
    });

    renderTime();
    renderMarkers();
    renderPlaylist();
  </script>
</body>
</html>
