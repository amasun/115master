<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="三大入口形态架构图">
  <defs>
    <style>
      .ui-font { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif; }
      .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <clipPath id="rootClip">
      <rect x="0" y="0" width="960" height="360" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#rootClip)" class="ui-font">
    <rect x="0" y="0" width="960" height="360" fill="#000000" />

    <!-- Header -->
    <text x="28" y="38" fill="#f5f5f7" font-size="15" font-weight="700">三大入口形态与共享本地底座</text>
    <text x="240" y="38" fill="#71717a" font-size="12">同一份浏览器本地索引，在 115 原生页面与独立影院间无缝协同</text>

    <!-- U1 Card -->
    <g>
      <rect x="28" y="60" width="286" height="202" rx="14" fill="#121214" stroke="#262629" stroke-width="1" />
      <rect x="44" y="76" width="38" height="22" rx="11" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
      <text x="63" y="91" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="700" class="mono-font">U1</text>
      <text x="92" y="91" fill="#f5f5f7" font-size="13.5" font-weight="600">115 旧版增强</text>
      <!-- Mini Schematic -->
      <rect x="44" y="110" width="254" height="90" rx="8" fill="#0a0a0a" stroke="#222225" stroke-width="1" />
      <rect x="56" y="122" width="120" height="10" rx="5" fill="#27272a" />
      <rect x="56" y="140" width="54" height="38" rx="5" fill="#1c1c1e" stroke="#3f3f46" stroke-width="1" />
      <rect x="116" y="140" width="54" height="38" rx="5" fill="#1c1c1e" stroke="#3f3f46" stroke-width="1" />
      <rect x="176" y="140" width="110" height="38" rx="5" fill="#141416" stroke="#2585ff" stroke-opacity="0.45" stroke-width="1" />
      <text x="231" y="163" text-anchor="middle" fill="#60a5fa" font-size="10">番号资料卡片</text>
      <text x="44" y="224" fill="#a1a1aa" font-size="11.5">• 文件列表内嵌时间轴预览图</text>
      <text x="44" y="244" fill="#a1a1aa" font-size="11.5">• 演员文件夹自动替换头像</text>
    </g>

    <!-- U2 Card -->
    <g>
      <rect x="337" y="60" width="286" height="202" rx="14" fill="#121214" stroke="#262629" stroke-width="1" />
      <rect x="353" y="76" width="38" height="22" rx="11" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
      <text x="372" y="91" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="700" class="mono-font">U2</text>
      <text x="401" y="91" fill="#f5f5f7" font-size="13.5" font-weight="600">115 新版增强</text>
      <!-- Mini Schematic -->
      <rect x="353" y="110" width="254" height="90" rx="8" fill="#0a0a0a" stroke="#222225" stroke-width="1" />
      <rect x="365" y="122" width="150" height="10" rx="5" fill="#27272a" />
      <rect x="525" y="120" width="70" height="16" rx="8" fill="#2585ff" fill-opacity="0.22" stroke="#2585ff" stroke-opacity="0.5" stroke-width="1" />
      <text x="560" y="131.5" text-anchor="middle" fill="#60a5fa" font-size="9.5">▶ 播放</text>
      <rect x="365" y="142" width="230" height="46" rx="6" fill="#141416" stroke="#262629" stroke-width="1" />
      <circle cx="385" cy="165" r="11" fill="#27272a" />
      <rect x="404" y="154" width="104" height="8" rx="4" fill="#3f3f46" />
      <rect x="404" y="168" width="144" height="7" rx="3.5" fill="#27272a" />
      <text x="353" y="224" fill="#a1a1aa" font-size="11.5">• 无侵入关联封面、详情与 ED2K</text>
      <text x="353" y="244" fill="#a1a1aa" font-size="11.5">• 拦截原生删除实时同步本地库</text>
    </g>

    <!-- U3 Card (Highlighted) -->
    <g>
      <rect x="646" y="60" width="286" height="202" rx="14" fill="#141416" stroke="#2585ff" stroke-opacity="0.6" stroke-width="1.2" />
      <rect x="662" y="76" width="38" height="22" rx="11" fill="#2585ff" />
      <text x="681" y="91" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" class="mono-font">U3</text>
      <text x="710" y="91" fill="#f5f5f7" font-size="13.5" font-weight="600">影院模式（独立 SPA）</text>
      <!-- Mini Schematic -->
      <rect x="662" y="110" width="254" height="90" rx="8" fill="#0a0a0a" stroke="#222225" stroke-width="1" />
      <rect x="662" y="110" width="52" height="90" rx="8" fill="#141416" />
      <rect x="670" y="122" width="36" height="8" rx="4" fill="#2585ff" />
      <rect x="670" y="136" width="32" height="6" rx="3" fill="#27272a" />
      <rect x="670" y="148" width="32" height="6" rx="3" fill="#27272a" />
      <rect x="722" y="120" width="56" height="34" rx="5" fill="#1c1c1e" />
      <rect x="784" y="120" width="56" height="34" rx="5" fill="#1c1c1e" />
      <rect x="846" y="120" width="56" height="34" rx="5" fill="#1c1c1e" />
      <rect x="722" y="160" width="56" height="32" rx="5" fill="#1c1c1e" />
      <rect x="784" y="160" width="56" height="32" rx="5" fill="#1c1c1e" />
      <rect x="846" y="160" width="56" height="32" rx="5" fill="#1c1c1e" />
      <text x="662" y="224" fill="#d4d4d8" font-size="11.5">• 海报墙、演员墙、标签栏、院线库</text>
      <text x="662" y="244" fill="#d4d4d8" font-size="11.5">• 浮窗播放器、智能去重与清理中心</text>
    </g>

    <!-- Connector Arrows -->
    <line x1="171" y1="262" x2="171" y2="286" stroke="#3f3f46" stroke-width="1.2" />
    <line x1="480" y1="262" x2="480" y2="286" stroke="#3f3f46" stroke-width="1.2" />
    <line x1="789" y1="262" x2="789" y2="286" stroke="#2585ff" stroke-opacity="0.7" stroke-width="1.2" />

    <!-- Shared Bottom Foundation Bar -->
    <rect x="28" y="286" width="904" height="52" rx="14" fill="#141416" stroke="#262629" stroke-width="1" />
    <text x="48" y="317" fill="#f5f5f7" font-size="12.5" font-weight="600">本地优先共享底座</text>
    <rect x="196" y="299" width="166" height="26" rx="13" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
    <text x="279" y="316" text-anchor="middle" fill="#a1a1aa" font-size="11">IndexedDB 视频与刮削缓存</text>
    <rect x="376" y="299" width="140" height="26" rx="13" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
    <text x="446" y="316" text-anchor="middle" fill="#a1a1aa" font-size="11">Alt+K 全局超级搜索</text>
    <rect x="530" y="299" width="154" height="26" rx="13" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
    <text x="607" y="316" text-anchor="middle" fill="#a1a1aa" font-size="11">115 文件备注打点云同步</text>
    <rect x="698" y="299" width="214" height="26" rx="13" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
    <text x="805" y="316" text-anchor="middle" fill="#a1a1aa" font-size="11">.115bak 单文件跨设备备份</text>
  </g>
</svg>
