<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="播放器打点（Markers）交互演示">
  <defs>
    <style>
      .ui-font { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif; }
      .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      .step-1 { animation: step1Anim 10s infinite; }
      .step-2 { animation: step2Anim 10s infinite; }
      .step-3 { animation: step3Anim 10s infinite; }

      @keyframes step1Anim {
        0%, 33% { opacity: 1; }
        36%, 97% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes step2Anim {
        0%, 33% { opacity: 0; }
        36%, 66% { opacity: 1; }
        69%, 100% { opacity: 0; }
      }
      @keyframes step3Anim {
        0%, 66% { opacity: 0; }
        69%, 97% { opacity: 1; }
        100% { opacity: 0; }
      }

      .progress-fill { animation: progressFill 10s ease-in-out infinite; }
      .playhead { animation: playheadMove 10s ease-in-out infinite; }

      @keyframes progressFill {
        0% { width: 144px; }
        20%, 68% { width: 311px; }
        72%, 84% { width: 559px; }
        86%, 96% { width: 311px; }
        100% { width: 144px; }
      }
      @keyframes playheadMove {
        0% { transform: translateX(0px); }
        20%, 68% { transform: translateX(167px); }
        72%, 84% { transform: translateX(415px); }
        86%, 96% { transform: translateX(167px); }
        100% { transform: translateX(0px); }
      }

      .new-marker { animation: newMarkerPop 10s ease-out infinite; transform-origin: 347px 424px; }
      .new-marker-ring { animation: newMarkerRing 10s ease-out infinite; transform-origin: 347px 424px; }

      @keyframes newMarkerPop {
        0%, 20% { opacity: 0; transform: scale(0.4); }
        23%, 96% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.4); }
      }
      @keyframes newMarkerRing {
        0%, 20% { opacity: 0; transform: scale(0.5); }
        22% { opacity: 0.9; transform: scale(1); }
        32%, 100% { opacity: 0; transform: scale(2.8); }
      }

      .tip-m2 { animation: tipM2 10s ease-in-out infinite; }
      .tip-m3 { animation: tipM3 10s ease-in-out infinite; }

      @keyframes tipM2 {
        0%, 21% { opacity: 0; transform: translateY(6px); }
        24%, 35% { opacity: 1; transform: translateY(0px); }
        38%, 85% { opacity: 0; transform: translateY(6px); }
        87%, 96% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(6px); }
      }
      @keyframes tipM3 {
        0%, 70% { opacity: 0; transform: translateY(6px); }
        73%, 84% { opacity: 1; transform: translateY(0px); }
        87%, 100% { opacity: 0; transform: translateY(6px); }
      }

      .marker-drawer { animation: drawerAnim 10s ease-in-out infinite; }
      @keyframes drawerAnim {
        0%, 34% { opacity: 0; transform: translateY(10px); }
        38%, 66% { opacity: 1; transform: translateY(0px); }
        70%, 100% { opacity: 0; transform: translateY(10px); }
      }

      .key-b { animation: keyB 10s infinite; }
      .key-dot { animation: keyDot 10s infinite; }
      .key-comma { animation: keyComma 10s infinite; }

      @keyframes keyB {
        0%, 19% { opacity: 0; }
        21%, 32% { opacity: 1; }
        35%, 100% { opacity: 0; }
      }
      @keyframes keyDot {
        0%, 69% { opacity: 0; }
        71%, 81% { opacity: 1; }
        83%, 100% { opacity: 0; }
      }
      @keyframes keyComma {
        0%, 84% { opacity: 0; }
        86%, 95% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
    </style>

    <clipPath id="playerClip">
      <rect x="0.5" y="0.5" width="959" height="539" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#playerClip)" class="ui-font">
    <!-- White Manual Canvas -->
    <rect x="0" y="0" width="960" height="540" fill="#ffffff" />

    <!-- Top Header Bar -->
    <rect x="0" y="0" width="960" height="52" fill="#fafafa" />
    <line x1="0" y1="52" x2="960" y2="52" stroke="#e4e4e7" stroke-width="1" />
    <rect x="24" y="15" width="44" height="22" rx="5" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
    <text x="46" y="29.5" text-anchor="middle" fill="#18181b" font-size="10.5" font-weight="700">115M</text>
    <text x="78" y="30" fill="#09090b" font-size="13.5" font-weight="600">MASTER 播放器 · 打点（Markers）交互示意</text>

    <!-- Animated Step Indicator Pills -->
    <g class="step-1">
      <rect x="742" y="13" width="194" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <circle cx="758" cy="26" r="3.5" fill="#2563eb" />
      <text x="770" y="30" fill="#2563eb" font-size="11.5" font-weight="600">01 按 B 在当前位置打点</text>
    </g>
    <g class="step-2">
      <rect x="734" y="13" width="202" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <circle cx="750" cy="26" r="3.5" fill="#2563eb" />
      <text x="762" y="30" fill="#2563eb" font-size="11.5" font-weight="600">02 展开打点列表查看与管理</text>
    </g>
    <g class="step-3">
      <rect x="724" y="13" width="212" height="26" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <circle cx="740" cy="26" r="3.5" fill="#2563eb" />
      <text x="752" y="30" fill="#2563eb" font-size="11.5" font-weight="600">03 按 , / . 在打点间快速跳转</text>
    </g>

    <!-- Center Video Wireframe Stage -->
    <rect x="24" y="68" width="912" height="328" rx="10" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1" />
    <line x1="24" y1="68" x2="936" y2="396" stroke="#e4e4e7" stroke-width="1" />
    <line x1="936" y1="68" x2="24" y2="396" stroke="#e4e4e7" stroke-width="1" />
    <rect x="424" y="196" width="112" height="64" rx="8" fill="#ffffff" stroke="#d4d4d8" stroke-width="1" />
    <polygon points="472,216 472,240 492,228" fill="#18181b" />
    <text x="480" y="284" text-anchor="middle" fill="#71717a" font-size="11.5">视频画面区域（16:9 Viewport）</text>

    <!-- Marker List Drawer (Step 2) -->
    <g class="marker-drawer">
      <rect x="650" y="88" width="268" height="234" rx="10" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" />
      <rect x="650" y="88" width="268" height="40" rx="10" fill="#fafafa" />
      <line x1="650" y1="128" x2="918" y2="128" stroke="#e4e4e7" stroke-width="1" />
      <text x="668" y="113" fill="#09090b" font-size="12.5" font-weight="600">打点列表 (3)</text>
      <text x="900" y="113" text-anchor="end" fill="#71717a" font-size="10.5">点击跳转 / 改名</text>

      <!-- Row 1 -->
      <rect x="662" y="140" width="244" height="48" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1" />
      <circle cx="678" cy="164" r="3.5" fill="#71717a" />
      <text x="690" y="161" fill="#09090b" font-size="12" font-weight="600">开场亮点</text>
      <text x="690" y="177" fill="#71717a" font-size="10.5" class="mono-font">00:12:40</text>
      <text x="894" y="168" text-anchor="end" fill="#71717a" font-size="11">跳转 →</text>

      <!-- Row 2 (Active) -->
      <rect x="662" y="196" width="244" height="48" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
      <circle cx="678" cy="220" r="3.5" fill="#2563eb" />
      <text x="690" y="217" fill="#09090b" font-size="12" font-weight="600">高能片段</text>
      <text x="690" y="233" fill="#2563eb" font-size="10.5" class="mono-font">00:42:10 · 刚刚添加</text>
      <text x="894" y="224" text-anchor="end" fill="#2563eb" font-size="11" font-weight="600">当前</text>

      <!-- Row 3 -->
      <rect x="662" y="252" width="244" height="48" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1" />
      <circle cx="678" cy="276" r="3.5" fill="#71717a" />
      <text x="690" y="273" fill="#09090b" font-size="12" font-weight="600">结尾彩蛋</text>
      <text x="690" y="289" fill="#71717a" font-size="10.5" class="mono-font">01:14:25</text>
      <text x="894" y="280" text-anchor="end" fill="#71717a" font-size="11">跳转 →</text>
    </g>

    <!-- Bottom Player Control Panel -->
    <rect x="0" y="408" width="960" height="132" fill="#ffffff" />
    <line x1="0" y1="408" x2="960" y2="408" stroke="#e4e4e7" stroke-width="1" />

    <!-- Animated Tooltip for Marker 2 (x=347) -->
    <g class="tip-m2">
      <rect x="275" y="374" width="144" height="28" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1" />
      <circle cx="290" cy="388" r="3.5" fill="#2563eb" />
      <text x="301" y="392" fill="#09090b" font-size="11" font-weight="600">00:42:10 高能片段</text>
      <polygon points="342,402 352,402 347,407" fill="#d4d4d8" />
    </g>

    <!-- Animated Tooltip for Marker 3 (x=595) -->
    <g class="tip-m3">
      <rect x="523" y="374" width="144" height="28" rx="6" fill="#ffffff" stroke="#d4d4d8" stroke-width="1" />
      <circle cx="538" cy="388" r="3.5" fill="#2563eb" />
      <text x="549" y="392" fill="#09090b" font-size="11" font-weight="600">01:14:25 结尾彩蛋</text>
      <polygon points="590,402 600,402 595,407" fill="#d4d4d8" />
    </g>

    <!-- Progress Bar Track (x=36..924, width=888, y=424) -->
    <rect x="36" y="421" width="888" height="6" rx="3" fill="#e4e4e7" />
    <rect x="36" y="421" width="144" height="6" rx="3" fill="#2563eb" class="progress-fill" />

    <!-- Static Marker 1 (00:12:40 -> x=164) -->
    <circle cx="164" cy="424" r="5" fill="#ffffff" stroke="#18181b" stroke-width="2" />

    <!-- New Marker 2 (00:42:10 -> x=347) -->
    <circle cx="347" cy="424" r="6" fill="none" stroke="#2563eb" stroke-width="2" class="new-marker-ring" />
    <circle cx="347" cy="424" r="5" fill="#2563eb" stroke="#ffffff" stroke-width="1.5" class="new-marker" />

    <!-- Static Marker 3 (01:14:25 -> x=595) -->
    <circle cx="595" cy="424" r="5" fill="#ffffff" stroke="#18181b" stroke-width="2" />

    <!-- Playhead -->
    <g class="playhead">
      <circle cx="180" cy="424" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
    </g>

    <!-- Bottom Controls Row -->
    <polygon points="42,462 42,478 56,470" fill="#18181b" />
    <text x="74" y="474" fill="#52525b" font-size="12" class="mono-font">00:42:10 / 01:48:30</text>

    <!-- Marker Drawer Button -->
    <rect x="228" y="454" width="96" height="32" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1" />
    <circle cx="244" cy="470" r="3.5" fill="#2563eb" />
    <text x="255" y="474" fill="#09090b" font-size="12" font-weight="600">打点 (3)</text>

    <!-- Keyboard Shortcut Keycaps -->
    <g transform="translate(596, 454)">
      <rect x="0" y="0" width="94" height="32" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" />
      <rect x="0" y="0" width="94" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" class="key-b" />
      <rect x="10" y="7" width="20" height="18" rx="4" fill="#ffffff" stroke="#d4d4d8" stroke-width="1" />
      <text x="20" y="19.5" text-anchor="middle" fill="#09090b" font-size="11" font-weight="700" class="mono-font">B</text>
      <text x="38" y="20" fill="#52525b" font-size="11.5">添加打点</text>
    </g>

    <g transform="translate(702, 454)">
      <rect x="0" y="0" width="106" height="32" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" />
      <rect x="0" y="0" width="106" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" class="key-comma" />
      <rect x="10" y="7" width="20" height="18" rx="4" fill="#ffffff" stroke="#d4d4d8" stroke-width="1" />
      <text x="20" y="19.5" text-anchor="middle" fill="#09090b" font-size="11" font-weight="700" class="mono-font">,</text>
      <text x="38" y="20" fill="#52525b" font-size="11.5">上一打点</text>
    </g>

    <g transform="translate(820, 454)">
      <rect x="0" y="0" width="104" height="32" rx="6" fill="#fafafa" stroke="#d4d4d8" stroke-width="1" />
      <rect x="0" y="0" width="104" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" class="key-dot" />
      <rect x="10" y="7" width="20" height="18" rx="4" fill="#ffffff" stroke="#d4d4d8" stroke-width="1" />
      <text x="20" y="19.5" text-anchor="middle" fill="#09090b" font-size="11" font-weight="700" class="mono-font">.</text>
      <text x="38" y="20" fill="#52525b" font-size="11.5">下一打点</text>
    </g>

    <!-- Bottom Caption -->
    <text x="36" y="516" fill="#71717a" font-size="11">提示：打点数据按视频保存在本地，开启同步后可自动备份至 115 文件备注字段。</text>
  </g>

  <!-- Outer Window Border -->
  <rect x="0.5" y="0.5" width="959" height="539" rx="12" fill="none" stroke="#e4e4e7" stroke-width="1" />
</svg>
