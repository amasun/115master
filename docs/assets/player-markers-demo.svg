<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-label="播放器打点（Markers）交互演示">
  <defs>
    <style>
      .ui-font { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif; }
      .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }

      /* Step pills (10s cycle) */
      .step-1 { animation: step1Anim 10s infinite; }
      .step-2 { animation: step2Anim 10s infinite; }
      .step-3 { animation: step3Anim 10s infinite; }

      @keyframes step1Anim {
        0%, 33% { opacity: 1; }
        36%, 97% { opacity: 0; }
        100% { opacity: 1; }
      }
      @keyframes step2Anim {
        0%, 33% { opacity: 0; }
        36%, 66% { opacity: 1; }
        69%, 100% { opacity: 0; }
      }
      @keyframes step3Anim {
        0%, 66% { opacity: 0; }
        69%, 97% { opacity: 1; }
        100% { opacity: 0; }
      }

      /* Progress fill and playhead */
      .progress-fill { animation: progressFill 10s ease-in-out infinite; }
      .playhead { animation: playheadMove 10s ease-in-out infinite; }

      @keyframes progressFill {
        0% { width: 144px; }
        20%, 68% { width: 311px; }
        72%, 84% { width: 559px; }
        86%, 96% { width: 311px; }
        100% { width: 144px; }
      }
      @keyframes playheadMove {
        0% { transform: translateX(0px); }
        20%, 68% { transform: translateX(167px); }
        72%, 84% { transform: translateX(415px); }
        86%, 96% { transform: translateX(167px); }
        100% { transform: translateX(0px); }
      }

      /* New marker creation at 00:42:10 (x=347) */
      .new-marker { animation: newMarkerPop 10s ease-out infinite; transform-origin: 347px 418px; }
      .new-marker-ring { animation: newMarkerRing 10s ease-out infinite; transform-origin: 347px 418px; }

      @keyframes newMarkerPop {
        0%, 20% { opacity: 0; transform: scale(0.4); }
        23%, 96% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.4); }
      }
      @keyframes newMarkerRing {
        0%, 20% { opacity: 0; transform: scale(0.5); }
        22% { opacity: 0.9; transform: scale(1); }
        32%, 100% { opacity: 0; transform: scale(2.8); }
      }

      /* Callout tooltips */
      .tip-m2 { animation: tipM2 10s ease-in-out infinite; }
      .tip-m3 { animation: tipM3 10s ease-in-out infinite; }

      @keyframes tipM2 {
        0%, 21% { opacity: 0; transform: translateY(6px); }
        24%, 35% { opacity: 1; transform: translateY(0px); }
        38%, 85% { opacity: 0; transform: translateY(6px); }
        87%, 96% { opacity: 1; transform: translateY(0px); }
        100% { opacity: 0; transform: translateY(6px); }
      }
      @keyframes tipM3 {
        0%, 70% { opacity: 0; transform: translateY(6px); }
        73%, 84% { opacity: 1; transform: translateY(0px); }
        87%, 100% { opacity: 0; transform: translateY(6px); }
      }

      /* Marker list drawer */
      .marker-drawer { animation: drawerAnim 10s ease-in-out infinite; }
      @keyframes drawerAnim {
        0%, 34% { opacity: 0; transform: translateY(10px); }
        38%, 66% { opacity: 1; transform: translateY(0px); }
        70%, 100% { opacity: 0; transform: translateY(10px); }
      }

      /* Keycaps highlight */
      .key-b { animation: keyB 10s infinite; }
      .key-dot { animation: keyDot 10s infinite; }
      .key-comma { animation: keyComma 10s infinite; }

      @keyframes keyB {
        0%, 19% { opacity: 0; }
        21%, 32% { opacity: 1; }
        35%, 100% { opacity: 0; }
      }
      @keyframes keyDot {
        0%, 69% { opacity: 0; }
        71%, 81% { opacity: 1; }
        83%, 100% { opacity: 0; }
      }
      @keyframes keyComma {
        0%, 84% { opacity: 0; }
        86%, 95% { opacity: 1; }
        97%, 100% { opacity: 0; }
      }
    </style>

    <radialGradient id="stageGlow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#1e2230" stop-opacity="0.7" />
      <stop offset="65%" stop-color="#0d0d10" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>

    <clipPath id="playerClip">
      <rect x="0" y="0" width="960" height="540" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#playerClip)" class="ui-font">
    <!-- Pure black background -->
    <rect x="0" y="0" width="960" height="540" fill="#000000" />
    <rect x="0" y="0" width="960" height="474" fill="url(#stageGlow)" />

    <!-- Subtle cinema frame center decoration -->
    <circle cx="480" cy="225" r="56" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" />
    <polygon points="468,205 504,225 468,245" fill="#ffffff" fill-opacity="0.12" />

    <!-- Top Title Bar -->
    <rect x="0" y="0" width="960" height="48" fill="#0a0a0a" fill-opacity="0.82" />
    <line x1="0" y1="48" x2="960" y2="48" stroke="#1f1f22" stroke-width="1" />
    <text x="24" y="29" fill="#f5f5f7" font-size="13.5" font-weight="600">STAR-801 · 星夜霓虹下的东京漫游记</text>
    <rect x="278" y="15" width="54" height="20" rx="10" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
    <text x="305" y="28.5" text-anchor="middle" fill="#a1a1aa" font-size="10.5" font-weight="600">4K 原画</text>

    <!-- Dynamic Step Indicator Pills (top-left of viewport) -->
    <g class="step-1">
      <rect x="24" y="66" width="236" height="32" rx="16" fill="#141416" stroke="#ec4899" stroke-opacity="0.55" stroke-width="1" />
      <circle cx="42" cy="82" r="4.5" fill="#ec4899" />
      <text x="55" y="86.5" fill="#f5f5f7" font-size="12" font-weight="600">1 / 3  按 B 在当前位置打点</text>
    </g>
    <g class="step-2">
      <rect x="24" y="66" width="268" height="32" rx="16" fill="#141416" stroke="#2585ff" stroke-opacity="0.55" stroke-width="1" />
      <circle cx="42" cy="82" r="4.5" fill="#2585ff" />
      <text x="55" y="86.5" fill="#f5f5f7" font-size="12" font-weight="600">2 / 3  打点列表：备注 · 改名 · 跳转</text>
    </g>
    <g class="step-3">
      <rect x="24" y="66" width="256" height="32" rx="16" fill="#141416" stroke="#22c55e" stroke-opacity="0.55" stroke-width="1" />
      <circle cx="42" cy="82" r="4.5" fill="#22c55e" />
      <text x="55" y="86.5" fill="#f5f5f7" font-size="12" font-weight="600">3 / 3  按 , / . 在打点间快速跳转</text>
    </g>

    <!-- Floating Marker List Drawer (Phase 2) -->
    <g class="marker-drawer">
      <rect x="646" y="138" width="286" height="222" rx="14" fill="#141416" fill-opacity="0.96" stroke="#2c2c2f" stroke-width="1" />
      <text x="664" y="165" fill="#f5f5f7" font-size="12.5" font-weight="600">视频打点 (3)</text>
      <text x="914" y="165" text-anchor="end" fill="#60a5fa" font-size="11" font-weight="500">+ 当前位置打点</text>
      <line x1="662" y1="176" x2="916" y2="176" stroke="#262629" stroke-width="1" />

      <!-- Row 1 -->
      <rect x="658" y="186" width="262" height="44" rx="9" fill="#1c1c1e" />
      <circle cx="674" cy="208" r="4" fill="#ec4899" />
      <text x="686" y="204" fill="#a1a1aa" font-size="10.5" class="mono-font">00:12:05</text>
      <text x="686" y="220" fill="#e4e4e7" font-size="11.5">开场片头</text>
      <text x="906" y="212" text-anchor="end" fill="#71717a" font-size="10.5">改名 · 删除</text>

      <!-- Row 2 (Active newly created marker) -->
      <rect x="658" y="238" width="262" height="48" rx="9" fill="#2585ff" fill-opacity="0.16" stroke="#2585ff" stroke-opacity="0.55" stroke-width="1" />
      <circle cx="674" cy="262" r="4.5" fill="#ec4899" />
      <text x="686" y="257" fill="#60a5fa" font-size="10.5" font-weight="600" class="mono-font">00:42:10</text>
      <rect x="744" y="246" width="34" height="15" rx="7.5" fill="#ec4899" />
      <text x="761" y="256.5" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="600">NEW</text>
      <text x="686" y="274" fill="#f5f5f7" font-size="12" font-weight="600">高能片段</text>
      <text x="906" y="266" text-anchor="end" fill="#a1a1aa" font-size="10.5">改名 · 删除</text>

      <!-- Row 3 -->
      <rect x="658" y="294" width="262" height="44" rx="9" fill="#1c1c1e" />
      <circle cx="674" cy="316" r="4" fill="#ec4899" />
      <text x="686" y="312" fill="#a1a1aa" font-size="10.5" class="mono-font">01:15:40</text>
      <text x="686" y="328" fill="#e4e4e7" font-size="11.5">经典桥段</text>
      <text x="906" y="320" text-anchor="end" fill="#71717a" font-size="10.5">改名 · 删除</text>
    </g>

    <!-- Hover / Active Marker Callouts above timeline -->
    <g class="tip-m2">
      <rect x="282" y="366" width="130" height="32" rx="10" fill="#1c1c1e" stroke="#ec4899" stroke-opacity="0.65" stroke-width="1" />
      <text x="347" y="386" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="600">00:42:10 · 高能片段</text>
      <polygon points="341,398 353,398 347,405" fill="#ec4899" />
    </g>
    <g class="tip-m3">
      <rect x="530" y="366" width="130" height="32" rx="10" fill="#1c1c1e" stroke="#22c55e" stroke-opacity="0.65" stroke-width="1" />
      <text x="595" y="386" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="600">01:15:40 · 经典桥段</text>
      <polygon points="589,398 601,398 595,405" fill="#22c55e" />
    </g>

    <!-- Bottom Player Controls Area -->
    <rect x="0" y="402" width="960" height="138" fill="#0a0a0a" fill-opacity="0.92" />
    <line x1="0" y1="402" x2="960" y2="402" stroke="#1f1f22" stroke-width="1" />

    <!-- Progress Track (x=36..924, width=888) -->
    <rect x="36" y="415" width="888" height="6" rx="3" fill="#27272a" />
    <rect x="36" y="415" width="144" height="6" rx="3" fill="#2585ff" class="progress-fill" />

    <!-- Pre-existing Marker 1 (00:12:05 -> x=125) -->
    <rect x="123" y="411" width="4" height="14" rx="2" fill="#ec4899" />

    <!-- Pre-existing Marker 3 (01:15:40 -> x=595) -->
    <rect x="593" y="411" width="4" height="14" rx="2" fill="#ec4899" />

    <!-- Newly Created Marker 2 (00:42:10 -> x=347) -->
    <circle cx="347" cy="418" r="10" fill="none" stroke="#ec4899" stroke-width="2" class="new-marker-ring" />
    <rect x="344.5" y="409" width="5" height="18" rx="2.5" fill="#ec4899" stroke="#ffffff" stroke-width="1" class="new-marker" />

    <!-- Playhead Dot (base x=180) -->
    <g class="playhead">
      <circle cx="180" cy="418" r="7.5" fill="#ffffff" stroke="#2585ff" stroke-width="2.5" />
    </g>

    <!-- Control Bar Row (y=438..472) -->
    <!-- Play icon -->
    <polygon points="40,444 52,451 40,458" fill="#f5f5f7" />
    <text x="68" y="455" fill="#d4d4d8" font-size="11.5" class="mono-font">00:42:10 / 02:00:00</text>

    <!-- Right Control Icons: Marker Button Highlighted -->
    <rect x="752" y="438" width="76" height="26" rx="13" fill="#ec4899" fill-opacity="0.18" stroke="#ec4899" stroke-opacity="0.6" stroke-width="1" />
    <circle cx="768" cy="451" r="4" fill="#ec4899" />
    <text x="778" y="455" fill="#f9a8d4" font-size="11.5" font-weight="600">打点 (3)</text>

    <rect x="838" y="438" width="42" height="26" rx="13" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
    <text x="859" y="455" text-anchor="middle" fill="#a1a1aa" font-size="11">字幕</text>

    <rect x="888" y="438" width="38" height="26" rx="13" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
    <text x="907" y="455" text-anchor="middle" fill="#a1a1aa" font-size="11">1.0x</text>

    <!-- Shortcut Keycap Bar (y=482..526) -->
    <rect x="36" y="482" width="888" height="44" rx="12" fill="#141416" stroke="#242427" stroke-width="1" />
    <text x="54" y="508" fill="#71717a" font-size="11.5">快捷键演示</text>

    <!-- Key B -->
    <g>
      <rect x="150" y="490" width="160" height="28" rx="8" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
      <rect x="150" y="490" width="160" height="28" rx="8" fill="#ec4899" fill-opacity="0.22" stroke="#ec4899" stroke-width="1.2" class="key-b" />
      <rect x="160" y="495" width="22" height="18" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="171" y="508" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="700" class="mono-font">B</text>
      <text x="192" y="508" fill="#e4e4e7" font-size="11.5">在当前位置打点</text>
    </g>

    <!-- Key , -->
    <g>
      <rect x="330" y="490" width="144" height="28" rx="8" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
      <rect x="330" y="490" width="144" height="28" rx="8" fill="#2585ff" fill-opacity="0.22" stroke="#2585ff" stroke-width="1.2" class="key-comma" />
      <rect x="340" y="495" width="22" height="18" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="351" y="508" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="700" class="mono-font">,</text>
      <text x="372" y="508" fill="#e4e4e7" font-size="11.5">上一个打点</text>
    </g>

    <!-- Key . -->
    <g>
      <rect x="494" y="490" width="144" height="28" rx="8" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
      <rect x="494" y="490" width="144" height="28" rx="8" fill="#22c55e" fill-opacity="0.22" stroke="#22c55e" stroke-width="1.2" class="key-dot" />
      <rect x="504" y="495" width="22" height="18" rx="4" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="515" y="508" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="700" class="mono-font">.</text>
      <text x="536" y="508" fill="#e4e4e7" font-size="11.5">下一个打点</text>
    </g>

    <text x="906" y="508" text-anchor="end" fill="#71717a" font-size="11">自动保存至本地 · 移动改名仍有效</text>
  </g>
</svg>
