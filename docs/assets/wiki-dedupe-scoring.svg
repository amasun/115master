<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="智能去重保留评分权重图">
  <defs>
    <style>
      .ui-font { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif; }
      .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <linearGradient id="ltxBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <clipPath id="dedupeClip">
      <rect x="0" y="0" width="960" height="380" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#dedupeClip)" class="ui-font">
    <rect x="0" y="0" width="960" height="380" fill="#000000" />
    <text x="28" y="36" fill="#f5f5f7" font-size="15" font-weight="700">智能去重 · 推荐保留评分权重阶梯</text>
    <text x="316" y="36" fill="#71717a" font-size="12">同组重复文件自动按累计得分高低推荐保留最优版本</text>

    <!-- Container -->
    <rect x="28" y="56" width="904" height="300" rx="14" fill="#121214" stroke="#242427" stroke-width="1" />

    <!-- Row 1: Starred +1000 -->
    <text x="50" y="88" fill="#f5f5f7" font-size="12" font-weight="600">已星标收藏</text>
    <rect x="230" y="74" width="600" height="18" rx="9" fill="#1c1c1e" />
    <rect x="230" y="74" width="600" height="18" rx="9" fill="#fbbf24" />
    <text x="846" y="87" fill="#fcd34d" font-size="12" font-weight="700" class="mono-font">+1000</text>

    <!-- Row 2: Markers +500~700 -->
    <text x="50" y="122" fill="#f5f5f7" font-size="12" font-weight="600">包含播放打点</text>
    <rect x="230" y="108" width="600" height="18" rx="9" fill="#1c1c1e" />
    <rect x="230" y="108" width="420" height="18" rx="9" fill="#ec4899" />
    <text x="846" y="121" fill="#f9a8d4" font-size="12" font-weight="700" class="mono-font">+500~700</text>

    <!-- Row 3: Drive Label +200 -->
    <text x="50" y="156" fill="#e4e4e7" font-size="12" font-weight="500">带有 115 网盘标签</text>
    <rect x="230" y="142" width="600" height="18" rx="9" fill="#1c1c1e" />
    <rect x="230" y="142" width="210" height="18" rx="9" fill="#2585ff" />
    <text x="846" y="155" fill="#60a5fa" font-size="12" font-weight="700" class="mono-font">+200</text>

    <!-- Row 4: LTX +180 -->
    <text x="50" y="190" fill="#e4e4e7" font-size="12" font-weight="500">LTX 高级去码</text>
    <rect x="230" y="176" width="600" height="18" rx="9" fill="#1c1c1e" />
    <rect x="230" y="176" width="188" height="18" rx="9" fill="url(#ltxBarGrad)" />
    <text x="846" y="189" fill="#e879f9" font-size="12" font-weight="700" class="mono-font">+180</text>

    <!-- Row 5: LADA / Chinese Sub +150 -->
    <text x="50" y="224" fill="#e4e4e7" font-size="12" font-weight="500">LADA 去码 / 中文字幕</text>
    <rect x="230" y="210" width="600" height="18" rx="9" fill="#1c1c1e" />
    <rect x="230" y="210" width="160" height="18" rx="9" fill="#8b5cf6" />
    <text x="846" y="223" fill="#c4b5fd" font-size="12" font-weight="700" class="mono-font">+150</text>

    <!-- Row 6: Bluray +120 -->
    <text x="50" y="258" fill="#d4d4d8" font-size="12">蓝光原盘版</text>
    <rect x="230" y="244" width="600" height="18" rx="9" fill="#1c1c1e" />
    <rect x="230" y="244" width="132" height="18" rx="9" fill="#06b6d4" />
    <text x="846" y="257" fill="#67e8f9" font-size="12" font-weight="700" class="mono-font">+120</text>

    <!-- Row 7: Uncensored / Cracked +100 -->
    <text x="50" y="292" fill="#d4d4d8" font-size="12">无码 / 破解版</text>
    <rect x="230" y="278" width="600" height="18" rx="9" fill="#1c1c1e" />
    <rect x="230" y="278" width="112" height="18" rx="9" fill="#10b981" />
    <text x="846" y="291" fill="#34d399" font-size="12" font-weight="700" class="mono-font">+100</text>

    <!-- Row 8: Resolution / Size / Duration -->
    <text x="50" y="326" fill="#a1a1aa" font-size="12">4K / 1080P · 体积 · 时长</text>
    <rect x="230" y="312" width="600" height="18" rx="9" fill="#1c1c1e" />
    <rect x="230" y="312" width="82" height="18" rx="9" fill="#52525b" />
    <text x="846" y="325" fill="#a1a1aa" font-size="11.5" class="mono-font">阶梯加分</text>
  </g>
</svg>
