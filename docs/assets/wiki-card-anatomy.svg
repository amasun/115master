<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="AV 卡片信息解剖图">
  <defs>
    <style>
      .ui-font { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif; }
      .mono-font { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
    <linearGradient id="ltxBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="cardArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="55%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#323036" />
    </linearGradient>
    <clipPath id="anatomyClip">
      <rect x="0" y="0" width="960" height="440" rx="16" />
    </clipPath>
    <clipPath id="posterInnerClip">
      <rect x="330" y="54" width="300" height="200" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#anatomyClip)" class="ui-font">
    <rect x="0" y="0" width="960" height="440" fill="#000000" />
    <text x="28" y="34" fill="#f5f5f7" font-size="14.5" font-weight="700">AV 卡片信息解剖图（悬停与点击交互说明）</text>

    <!-- Center Card Mockup (x=330..630, y=54..406) -->
    <rect x="330" y="54" width="300" height="352" rx="16" fill="#121214" stroke="#2c2c2f" stroke-width="1.2" />
    <g clip-path="url(#posterInnerClip)">
      <rect x="330" y="54" width="300" height="200" fill="url(#cardArt)" />
      <circle cx="560" cy="110" r="64" fill="#ffffff" fill-opacity="0.06" />
      <circle cx="388" cy="212" r="52" fill="#a1a1aa" fill-opacity="0.05" />
    </g>

    <!-- Top Left Badges -->
    <rect x="342" y="66" width="54" height="22" rx="11" fill="#000000" fill-opacity="0.65" />
    <text x="369" y="80.5" text-anchor="middle" fill="#f5f5f7" font-size="10.5" font-weight="600">2 版本</text>
    <rect x="402" y="66" width="36" height="22" rx="11" fill="#ec4899" />
    <text x="420" y="80.5" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700">● 4</text>

    <!-- Top Right: LTX + 2px white-stroke star -->
    <rect x="542" y="66" width="44" height="22" rx="11" fill="url(#ltxBadgeGrad)" />
    <text x="564" y="80.5" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="700" class="mono-font">LTX</text>
    <polygon points="606,65 609.5,72 617,73 611.5,78.5 612.8,86 606,82.2 599.2,86 600.5,78.5 595,73 602.5,72" fill="#fbbf24" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

    <!-- Center Play Button -->
    <circle cx="480" cy="154" r="22" fill="#2585ff" />
    <polygon points="474,144 491,154 474,164" fill="#ffffff" />

    <!-- Bottom Left Rating -->
    <rect x="342" y="220" width="90" height="22" rx="11" fill="#000000" fill-opacity="0.68" />
    <text x="352" y="234.5" fill="#fcd34d" font-size="11" class="mono-font">★ 4.8</text>
    <text x="392" y="234.5" fill="#d4d4d8" font-size="10" class="mono-font">(1.2k)</text>

    <!-- Bottom Right Duration -->
    <rect x="548" y="220" width="70" height="22" rx="11" fill="#000000" fill-opacity="0.68" />
    <text x="583" y="234.5" text-anchor="middle" fill="#ffffff" font-size="11" class="mono-font">02:14:30</text>

    <!-- Card Footer -->
    <text x="346" y="280" fill="#f5f5f7" font-size="13.5" font-weight="600">星夜霓虹下的东京漫游记</text>
    <text x="346" y="300" fill="#d4d4d8" font-size="12.5">4K HDR 收藏版</text>
    <text x="346" y="328" fill="#60a5fa" font-size="11.5">三上悠亚</text>
    <text x="396" y="328" fill="#52525b" font-size="11.5">·</text>
    <text x="556" y="328" text-anchor="end" fill="#a1a1aa" font-size="11.5">S1 NO.1 STYLE</text>
    <!-- Genre Pills -->
    <rect x="346" y="342" width="44" height="20" rx="10" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
    <text x="368" y="355.5" text-anchor="middle" fill="#d4d4d8" font-size="10.5">单体</text>
    <rect x="396" y="342" width="44" height="20" rx="10" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
    <text x="418" y="355.5" text-anchor="middle" fill="#d4d4d8" font-size="10.5">4K</text>
    <rect x="446" y="342" width="54" height="20" rx="10" fill="#1c1c1e" stroke="#2c2c2f" stroke-width="1" />
    <text x="473" y="355.5" text-anchor="middle" fill="#d4d4d8" font-size="10.5">中文字幕</text>
    <!-- Bottom Metadata Row -->
    <text x="346" y="390" fill="#e4e4e7" font-size="12" font-weight="600" class="mono-font">STAR-801</text>
    <text x="424" y="390" fill="#71717a" font-size="11" class="mono-font">2026-03-18</text>
    <rect x="556" y="375" width="58" height="20" rx="10" fill="#202022" stroke="#2e2e31" stroke-width="1" />
    <circle cx="569" cy="385" r="3.5" fill="#4ade80" />
    <text x="578" y="388.5" fill="#e4e4e7" font-size="10.5">精选</text>

    <!-- ==================== LEFT CALLOUTS ==================== -->
    <!-- Top Left -->
    <line x1="254" y1="77" x2="338" y2="77" stroke="#ec4899" stroke-width="1.2" stroke-dasharray="3 2" />
    <circle cx="338" cy="77" r="3" fill="#ec4899" />
    <rect x="28" y="56" width="226" height="44" rx="10" fill="#141416" stroke="#262629" stroke-width="1" />
    <text x="42" y="74" fill="#f5f5f7" font-size="11.5" font-weight="600">多版本 / 合集 / 打点数</text>
    <text x="42" y="90" fill="#a1a1aa" font-size="10.5">展示版本合并数与视频打点计数</text>

    <!-- Bottom Left Rating -->
    <line x1="254" y1="231" x2="338" y2="231" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="3 2" />
    <circle cx="338" cy="231" r="3" fill="#fbbf24" />
    <rect x="28" y="210" width="226" height="44" rx="10" fill="#141416" stroke="#262629" stroke-width="1" />
    <text x="42" y="228" fill="#f5f5f7" font-size="11.5" font-weight="600">★ 评分与评价人数</text>
    <text x="42" y="244" fill="#a1a1aa" font-size="10.5">支持按评分排序，同分按人数决胜</text>

    <!-- Actors -->
    <line x1="254" y1="324" x2="342" y2="324" stroke="#2585ff" stroke-width="1.2" stroke-dasharray="3 2" />
    <circle cx="342" cy="324" r="3" fill="#2585ff" />
    <rect x="28" y="302" width="226" height="44" rx="10" fill="#141416" stroke="#262629" stroke-width="1" />
    <text x="42" y="320" fill="#f5f5f7" font-size="11.5" font-weight="600">可点击演员与片商</text>
    <text x="42" y="336" fill="#a1a1aa" font-size="10.5">点击演员或右侧片商即时按同类筛选</text>

    <!-- Code & Date -->
    <line x1="254" y1="386" x2="342" y2="386" stroke="#71717a" stroke-width="1.2" stroke-dasharray="3 2" />
    <circle cx="342" cy="386" r="3" fill="#a1a1aa" />
    <rect x="28" y="364" width="226" height="44" rx="10" fill="#141416" stroke="#262629" stroke-width="1" />
    <text x="42" y="382" fill="#f5f5f7" font-size="11.5" font-weight="600">番号与精确发行日</text>
    <text x="42" y="398" fill="#a1a1aa" font-size="10.5">精确到天（YYYY-MM-DD）</text>

    <!-- ==================== RIGHT CALLOUTS ==================== -->
    <!-- Top Right -->
    <line x1="620" y1="77" x2="704" y2="77" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="3 2" />
    <circle cx="620" cy="77" r="3" fill="#a855f7" />
    <rect x="704" y="54" width="228" height="48" rx="10" fill="#141416" stroke="#262629" stroke-width="1" />
    <text x="718" y="73" fill="#f5f5f7" font-size="11.5" font-weight="600">去码/无码角标 + 收藏星标</text>
    <text x="718" y="90" fill="#a1a1aa" font-size="10.5">LTX/LADA/原生无码点击即筛选，星标 2px 白边</text>

    <!-- Center Play -->
    <line x1="504" y1="154" x2="704" y2="154" stroke="#2585ff" stroke-width="1.2" stroke-dasharray="3 2" />
    <circle cx="504" cy="154" r="3" fill="#2585ff" />
    <rect x="704" y="132" width="228" height="44" rx="10" fill="#141416" stroke="#262629" stroke-width="1" />
    <text x="718" y="150" fill="#f5f5f7" font-size="11.5" font-weight="600">悬停中心直接播放</text>
    <text x="718" y="166" fill="#a1a1aa" font-size="10.5">拉起顶层影院浮窗，不丢失滚动位置</text>

    <!-- Bottom Right Duration -->
    <line x1="620" y1="231" x2="704" y2="231" stroke="#71717a" stroke-width="1.2" stroke-dasharray="3 2" />
    <circle cx="620" cy="231" r="3" fill="#a1a1aa" />
    <rect x="704" y="210" width="228" height="44" rx="10" fill="#141416" stroke="#262629" stroke-width="1" />
    <text x="718" y="228" fill="#f5f5f7" font-size="11.5" font-weight="600">视频时长角标</text>
    <text x="718" y="244" fill="#a1a1aa" font-size="10.5">多版本自动取最长版本时长</text>

    <!-- 115 Drive Label -->
    <line x1="616" y1="385" x2="704" y2="385" stroke="#4ade80" stroke-width="1.2" stroke-dasharray="3 2" />
    <circle cx="616" cy="385" r="3" fill="#4ade80" />
    <rect x="704" y="364" width="228" height="44" rx="10" fill="#141416" stroke="#262629" stroke-width="1" />
    <text x="718" y="382" fill="#f5f5f7" font-size="11.5" font-weight="600">115 网盘原生标签</text>
    <text x="718" y="398" fill="#a1a1aa" font-size="10.5">深色胶囊配彩色圆点，与网盘端一致</text>
  </g>
</svg>
