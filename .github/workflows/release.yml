name: Release

on:
  workflow_dispatch:
  push:
    branches: [v2]
    paths:
      - 'apps/monkey/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '!**/*.md'
      - '!**/*.stories.*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ci:
    name: CI Checks
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm type-check

  release:
    name: Release
    needs: ci
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Version Packages
        run: pnpm version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Version
        id: version
        run: |
          VERSION=$(node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const pkgPath = "apps/monkey/package.json";
            const pkg = JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            const hasTag = (v) => {
              try {
                execFileSync("git", ["rev-parse", "--verify", "--quiet", `refs/tags/v${v}`], { stdio: "ignore" });
                return true;
              } catch {
                return false;
              }
            };
            let version = pkg.version;
            if (hasTag(version)) {
              const parts = version.split(".").map(Number);
              if (parts.length !== 3 || parts.some(Number.isNaN)) {
                throw new Error(`Invalid semver version: ${version}`);
              }
              do {
                parts[2] += 1;
                version = parts.join(".");
              } while (hasTag(version));
              pkg.version = version;
              fs.writeFileSync(pkgPath, `${JSON.stringify(pkg, null, 2)}\n`);
            }
            process.stdout.write(version);
          ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Check for Changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Version Changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: v${{ steps.version.outputs.version }} [skip ci]"
          git push

      - name: Build
        run: pnpm build

      - name: Create Tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Extract Release Notes
        id: notes
        run: |
          NOTES=$(node .github/scripts/extract-release-notes.mjs "${{ steps.version.outputs.version }}")
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: 115master fusion+ v${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            apps/monkey/dist/115master-fusion.user.js
            apps/monkey/dist/115master-fusion.meta.js
